<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Better Every Run before and after correction flow</title>
  <desc id="desc">A three-stage diagram showing repeated bad agent behavior, an explicit BER correction, and a later improved run.</desc>
  <rect width="1120" height="560" fill="#f7f6f2"/>
  <text x="56" y="72" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" fill="#1f2933">Better Every Run: correction becomes next-run behavior</text>
  <text x="56" y="108" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#52606d">Explicit command in, local evidence first, durable promotion only after review.</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="56" y="154" width="300" height="284" rx="8" fill="#ffffff" stroke="#c9c4b8"/>
    <text x="84" y="198" font-size="18" font-weight="700" fill="#9f1239">Before</text>
    <text x="84" y="236" font-size="15" fill="#29333d">Agent says “done” with a tidy</text>
    <text x="84" y="260" font-size="15" fill="#29333d">summary, but gives no exact</text>
    <text x="84" y="284" font-size="15" fill="#29333d">verification output or next action.</text>
    <rect x="84" y="322" width="244" height="64" rx="6" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="104" y="350" font-size="13" fill="#881337">Repeated failure: completion</text>
    <text x="104" y="370" font-size="13" fill="#881337">claim without proof.</text>

    <rect x="410" y="154" width="300" height="284" rx="8" fill="#ffffff" stroke="#c9c4b8"/>
    <text x="438" y="198" font-size="18" font-weight="700" fill="#334155">/ber fix</text>
    <text x="438" y="236" font-size="15" fill="#29333d">/ber fix agent says done</text>
    <text x="438" y="260" font-size="15" fill="#29333d">without proof -> agent gives</text>
    <text x="438" y="284" font-size="15" fill="#29333d">exact verification output first</text>
    <rect x="438" y="322" width="244" height="64" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="458" y="350" font-size="13" fill="#312e81">Stored locally under</text>
    <text x="458" y="370" font-size="13" fill="#312e81">.better-every-run/.</text>

    <rect x="764" y="154" width="300" height="284" rx="8" fill="#ffffff" stroke="#c9c4b8"/>
    <text x="792" y="198" font-size="18" font-weight="700" fill="#166534">After</text>
    <text x="792" y="236" font-size="15" fill="#29333d">Later run reports the command,</text>
    <text x="792" y="260" font-size="15" fill="#29333d">result, remaining risk, and the</text>
    <text x="792" y="284" font-size="15" fill="#29333d">next concrete action.</text>
    <rect x="792" y="322" width="244" height="64" rx="6" fill="#ecfdf3" stroke="#bbf7d0"/>
    <text x="812" y="350" font-size="13" fill="#14532d">Durable promotion waits</text>
    <text x="812" y="370" font-size="13" fill="#14532d">for a reviewed lesson card.</text>
  </g>
  <path d="M366 296H400" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M720 296H754" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <text x="56" y="502" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#52606d">The product rule stays strict: BER records only explicit corrections; it never silently edits memory or skill files.</text>
</svg>
